<section class="container my-5">
  <h2>Popular Categories</h2>

  <div class="row g-3">
    @if (categories$ | async; as categories) {
      @for (category of categories; track category.slug) {
        <div class="col-6 col-md-3">
          <a
            class="category-card"
            [routerLink]="['/categories', category.slug]">

            <h5>{{ category.name }}</h5>

          </a>
        </div>
      }
    }
  </div>
</section>
