<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">
    <a class="navbar-brand" routerLink="/" (click)="closeMenu()">
      <i class="fa-solid fa-bag-shopping brand-icon" aria-hidden="true"></i>
      <span>ShopHub</span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="navbar-main"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div
      class="navbar-collapse collapse"
      [class.show]="isMenuOpen()"
      id="navbar-main"
    >
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            [routerLinkActiveOptions]="{ exact: true }"
            routerLinkActive="active"
            (click)="closeMenu()"
            >Home</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/products"
            routerLinkActive="active"
            (click)="closeMenu()"
            >Products</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/categories"
            routerLinkActive="active"
            (click)="closeMenu()"
            >Categories</a
          >
        </li>
      </ul>

      <form class="search-form" role="search" (ngSubmit)="onSearch()">
        <div class="input-group">
          <input
            class="form-control"
            type="search"
            name="search"
            placeholder="Search products..."
            aria-label="Search products"
            [ngModel]="searchQuery()"
            (ngModelChange)="searchQuery.set($event)"
          />
          <button class="btn btn-search" type="submit" aria-label="Search">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          </button>
        </div>
      </form>

      <div class="nav-actions">
        <a class="nav-link" routerLink="/login" (click)="closeMenu()">Login</a>
        <a class="nav-link" routerLink="/register" (click)="closeMenu()"
          >Register</a
        >

        <a
          class="nav-link icon-link"
          routerLink="/cart"
          aria-label="Cart"
          (click)="closeMenu()"
        >
          <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
          <span class="badge-count">{{ cartCount() }}</span>
        </a>

        <a
          class="nav-link icon-link"
          routerLink="/wishlist"
          aria-label="Wishlist"
          (click)="closeMenu()"
        >
          <i class="fa-solid fa-heart" aria-hidden="true"></i>
        </a>
      </div>
    </div>
  </div>
</nav>
